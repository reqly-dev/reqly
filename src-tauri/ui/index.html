    <meta charset="utf-8" />

    <title>Reqster</title>
    <style>
      /* Renkler packages/app/src/styles.css koyu tema token'larıyla aynıdır. */
      :root {
        color-scheme: dark;
        --bg: #111827;
        --text: rgba(255, 255, 255, 0.87);
        --text-dim: rgba(255, 255, 255, 0.6);
        --accent: #d00000;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter var', Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }
      main {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }
      .logo {
        width: 72px;
        height: 72px;
        color: var(--accent);
      }
      .logo svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0;
        color: var(--text-dim);
        font-size: 14px;
      }
      p::after {
        content: '';
        display: inline-block;
        width: 1.2em;
        text-align: left;
        animation: dots 1.5s steps(4, end) infinite;
      }
      p.done::after {
        content: none;
        animation: none;
      }
      @keyframes dots {
        0% { content: ''; }
        25% { content: '.'; }
        50% { content: '..'; }
        75% { content: '...'; }
      }
    </style>
  </head>
