name: builder-image

# Tauri derleme imajı (deploy/tauri-builder.Dockerfile): Rust + Node (.nvmrc) + NSIS + cargo-xwin
# (Windows SDK önbelleği içinde) + webkit2gtk. Yalnızca Dockerfile değişince ya da elle tetiklenince
# yeniden üretilir; :latest + değişmez :<sha7> olarak localhost:3000 registry'sine basılır.
# Not: Node sürümü Dockerfile'daki NODE_VERSION ARG'ındadır; .nvmrc değişince ikisi birlikte güncellenir.
on:
  push:
    branches: [main]
    paths:
      - deploy/tauri-builder.Dockerfile
      - .gitea/workflows/builder-image.yml
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: İmajı üret ve bas
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${REGISTRY_TOKEN}" ]]; then echo "REGISTRY_TOKEN secret'ı yok"; exit 1; fi
          echo "${REGISTRY_TOKEN}" | docker login localhost:3000 -u "${REGISTRY_USER}" --password-stdin
          sha7=$(git rev-parse --short=7 HEAD)
          img=localhost:3000/mtcsrv/reqly-tauri-builder
          docker build -f deploy/tauri-builder.Dockerfile \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${img}:latest" -t "${img}:${sha7}" deploy/
          # Gitea'nın SQLite'ı büyük katmanlar paralel yüklenirken "database is locked" ile 500
          # dönebiliyor (koşu 206); push'u birkaç kez dene, zaten yüklenen katmanlar atlanır.
          push() { for i in 1 2 3 4; do docker push "$1" && return 0; echo "push başarısız (deneme $i), 20 sn sonra yeniden"; sleep 20; done; return 1; }
          push "${img}:${sha7}"
          push "${img}:latest"
          docker run --rm -u 1000:1000 -e HOME=/tmp/h "${img}:${sha7}" \
            sh -c 'node -v && cargo --version && cargo xwin --version && makensis -VERSION'
